name: Build APK

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (QR parser, packet codec, correlation, state machine, log)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Android lint (report only, artifacts uploaded)
        run: ./gradlew :app:lintDebug || true

      - name: Assemble diagnostic APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload OMNITRIX-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: OMNITRIX-debug-apk
          path: app/build/outputs/apk/debug/OMNITRIX-debug.apk

      - name: Upload lint + test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omnitrix-quality-reports
          path: |
            app/build/reports/
            app/build/test-results/testDebugUnitTest/
