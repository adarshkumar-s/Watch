name: Build APK

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Steps never abort early; results are collected in /tmp/rc/* and a final
      # always-run step publishes diagnostics to a commit comment, then fails the job.
      - name: Unit tests (QR parser, packet codec, correlation, state machine, log)
        run: |
          set -o pipefail  # runner shells must not rely on defaults; rc capture needs this
          mkdir -p /tmp/rc
          rc=0
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/g-test.log || rc=$?
          echo "$rc" > /tmp/rc/test

      - name: Android lint
        run: |
          set -o pipefail  # runner shells must not rely on defaults; rc capture needs this
          mkdir -p /tmp/rc
          rc=0
          ./gradlew :app:lintDebug 2>&1 | tee /tmp/g-lint.log || rc=$?
          echo "$rc" > /tmp/rc/lint

      - name: Assemble diagnostic APK
        run: |
          set -o pipefail  # runner shells must not rely on defaults; rc capture needs this
          mkdir -p /tmp/rc
          rc=0
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee /tmp/g-apk.log || rc=$?
          echo "$rc" > /tmp/rc/apk
          {
            echo "assemble rc=$rc"
            echo "PWD=$(pwd)"
            echo "--- ls app/build/outputs ---"; ls -laR app/build/outputs 2>&1 | head -40
            echo "--- any apk in repo ---"; find . -name "*.apk" 2>/dev/null | head -10
            echo "--- gradle 'what went wrong' ---"
            grep -nE "What went wrong|Execution failed for task|e: file|error:|Exception" /tmp/g-apk.log | head -30
            echo "--- tail of gradle log ---"; tail -n 25 /tmp/g-apk.log
          } > /tmp/apk-step-diag.txt 2>&1 || true

      - name: Normalize APK name
        if: always()
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/OMNITRIX-debug.apk
          fi
          ls -la app/build/outputs/apk/debug/ 2>&1 || true

      - name: Upload OMNITRIX-debug.apk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OMNITRIX-debug-apk
          path: app/build/outputs/apk/debug/OMNITRIX-debug.apk
          if-no-files-found: warn

      - name: Upload lint + test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omnitrix-quality-reports
          path: |
            app/build/reports/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

      - name: Test counts from junit XML
        if: always()
        run: |
          t=0; f=0
          if ls app/build/test-results/testDebugUnitTest/*.xml >/dev/null 2>&1; then
            for x in app/build/test-results/testDebugUnitTest/*.xml; do
              L=$(head -3 "$x" | grep '<testsuite' | head -1)
              n=$(echo "$L" | sed -n 's/.*tests="\([0-9]*\)".*/\1/p')
              fl=$(echo "$L" | sed -n 's/.*failures="\([0-9]*\)".*/\1/p')
              er=$(echo "$L" | sed -n 's/.*errors="\([0-9]*\)".*/\1/p')
              t=$((t + ${n:-0})); f=$((f + ${fl:-0} + ${er:-0}))
            done
          fi
          echo "- junit XML summary: **$t tests run, $f failures/errors**" > /tmp/junit-summary.md

      - name: Build report and commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          APK_FOUND="NO"
          if [ -f app/build/outputs/apk/debug/OMNITRIX-debug.apk ]; then
            APK_FOUND="yes ($(du -h app/build/outputs/apk/debug/OMNITRIX-debug.apk | cut -f1))"
          fi
          {
            echo "**OMNITRIX build report** (${{ github.sha }})"
            echo ""
            echo "- unit tests rc: $(cat /tmp/rc/test 2>/dev/null || echo '?')"
            echo "- lint rc: $(cat /tmp/rc/lint 2>/dev/null || echo '?')"
            echo "- assembleDebug rc: $(cat /tmp/rc/apk 2>/dev/null || echo '?')"
            echo "- OMNITRIX-debug.apk present: $APK_FOUND"
            echo '- test summary:'; echo '```';
            grep -hE "tests? (completed|failed)" /tmp/g-test.log 2>/dev/null | tail -3 || true; echo '```'
            cat /tmp/junit-summary.md 2>/dev/null || true
            echo '- build outputs:'; echo '```'; find app/build/outputs -type f 2>/dev/null; echo '```'
            echo '**failed tests**'; echo '```'; grep -hE " > .* FAILED" /tmp/g-test.log 2>/dev/null | sort -u | head -30; echo '```'
            if [ "$(cat /tmp/rc/test 2>/dev/null)" != "0" ]; then
              echo '**test log tail**'; echo '```'; tail -n 90 /tmp/g-test.log; echo '```'
            fi
            if [ "$(cat /tmp/rc/apk 2>/dev/null)" != "0" ]; then
              echo '**assemble log tail**'; echo '```'; tail -n 90 /tmp/g-apk.log; echo '```'
            fi
            if [ "$(cat /tmp/rc/lint 2>/dev/null)" != "0" ]; then
              echo '**lint log tail**'; echo '```'; tail -n 40 /tmp/g-lint.log; echo '```'
            fi
            echo '**assemble step diagnostics**'; echo '```'; cat /tmp/apk-step-diag.txt 2>/dev/null; echo '```'
          } > /tmp/report.md 2>/dev/null || true
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            -F body=@/tmp/report.md || true
          test "$(cat /tmp/rc/test 2>/dev/null)" = "0" -a "$(cat /tmp/rc/apk 2>/dev/null)" = "0"
    r=ET.parse(x).getroot()
    t+=int(r.get('tests',0)); f+=int(r.get('failures',0))+int(r.get('errors',0))
print('')
print(f'- junit XML summary: **{t} tests run, {f} failures/errors**')
PYEOF
            fi
              echo '**test log tail**'; echo '```'; tail -n 90 /tmp/g-test.log; echo '```'
            fi
            if [ "$(cat /tmp/rc/apk 2>/dev/null)" != "0" ]; then
              echo '**assemble log tail**'; echo '```'; tail -n 90 /tmp/g-apk.log; echo '```'
            fi
            if [ "$(cat /tmp/rc/lint 2>/dev/null)" != "0" ]; then
              echo '**lint log tail**'; echo '```'; tail -n 40 /tmp/g-lint.log; echo '```'
            fi
            echo '**assemble step diagnostics**'; echo '```'; cat /tmp/apk-step-diag.txt 2>/dev/null; echo '```'
          } > /tmp/report.md 2>/dev/null || true
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            -F body=@/tmp/report.md || true
          test "$(cat /tmp/rc/test 2>/dev/null)" = "0" -a "$(cat /tmp/rc/apk 2>/dev/null)" = "0"
