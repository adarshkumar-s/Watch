name: Build APK

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # so failure reports can be posted as commit comments

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # On failure the gradle log tail is posted as a commit comment (readable without
      # downloading raw logs) and emitted as check annotations.
      - name: Unit tests (QR parser, packet codec, correlation, state machine, log)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rc=0
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/g-test.log || rc=$?
          if [ $rc -ne 0 ]; then
            { echo "**Unit tests failed (exit $rc)**"; echo '```';
              tail -n 120 /tmp/g-test.log; echo '```'; } > /tmp/body.md
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
              -F body=@/tmp/body.md >/dev/null 2>&1 || true
            tail -n 22 /tmp/g-test.log | while IFS= read -r l; do echo "::error::$l"; done
            exit $rc
          fi

      - name: Android lint (report only)
        run: |
          rc=0
          ./gradlew :app:lintDebug 2>&1 | tee /tmp/g-lint.log || rc=$?
          { grep -E "Error: " /tmp/g-lint.log | tail -12 || echo "(no lint error lines)"; } \
            | while IFS= read -r l; do echo "::notice::$l"; done
          echo "lint exit=$rc (report only)"

      - name: Assemble diagnostic APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rc=0
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee /tmp/g-apk.log || rc=$?
          if [ $rc -ne 0 ]; then
            { echo "**assembleDebug failed (exit $rc)**"; echo '```';
              tail -n 120 /tmp/g-apk.log; echo '```'; } > /tmp/body.md
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
              -F body=@/tmp/body.md >/dev/null 2>&1 || true
            tail -n 22 /tmp/g-apk.log | while IFS= read -r l; do echo "::error::$l"; done
            exit $rc
          fi
          ls -la app/build/outputs/apk/debug/

      - name: Upload OMNITRIX-debug.apk
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OMNITRIX-debug-apk
          path: app/build/outputs/apk/debug/OMNITRIX-debug.apk
          if-no-files-found: error

      - name: Upload lint + test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omnitrix-quality-reports
          path: |
            app/build/reports/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
